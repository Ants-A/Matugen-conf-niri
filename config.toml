[config]
version_check = false

[config.wallpaper]
command = "cp {{ image }} ~/.config/quickshell/assets/Wallpaper && magick ~/.config/quickshell/assets/Wallpaper -resize 512 ~/.config/quickshell/assets/Wallpaper"

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'

[templates.niri]
input_path='~/.config/matugen/templates/niri.kdl'
output_path='~/.config/niri/colors.kdl'

[templates.mpv]
input_path = '~/.config/matugen/templates/mpv/mpv.conf'
output_path = '~/.config/mpv/script-opts/niri_caelestia.conf'

[templates.quickshell]
input_path = './templates/quickshell'
output_path = '~/.config/quickshell/Colors.qml'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-theme.conf'
output_path = '~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf'
post_hook = 'pkill -USR1 -u "$(id -u)" -x kitty || true'

[templates.fish]
input_path = "~/.config/matugen/templates/colors.fish"
output_path = "~/.config/fish/conf.d/matugen-colors.fish"

[templates.sequences]
input_path = "~/.config/matugen/templates/sequences.txt"
output_path = "~/.local/state/quickshell/user/generated/terminal/sequences.txt"

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook   = "hyprctl reload"

[templates.vice]
input_path = "/home/ant/.config/vice/matugen-color-template"
output_path = "/home/ant/.config/vice/matugen-color"

[templates.starship]
input_path = "~/.config/matugen/templates/starship.toml"
output_path = "~/.config/zsh/starship.toml"

[templates.zsh]
input_path = "~/.config/matugen/templates/colors.zsh"
output_path = "~/.cache/matugen/colors.zsh"

[templates.vicinae]
input_path = './templates/vicinae.toml'
output_path = '~/.local/share/vicinae/themes/matugen.toml'
post_hook = 'vicinae theme set matugen'

[templates.vesktop]
input_path = "~/.config/matugen/templates/midnight-discord.css"
output_path = "~/.config/vesktop/themes/midnight.theme.css"

[templates.vencord]
input_path = "~/.config/matugen/templates/midnight-discord.css"
output_path = "~/.config/Vencord/themes/midnight.theme.css"

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

